name: "CodeQL Advanced"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    environment: Cloud

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Setup local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Create Config.kt
        run: |
          cat > app/src/main/java/com/cloud/core/objects/Config.kt << 'EOF'
          package com.cloud.core.objects
          import android.content.Context
          import android.widget.Toast
          import com.cloud.BuildConfig
          import com.cloud.core.activities.Cloud.Companion.appScope
          import com.cloud.core.functions.ERRORINSERTDATA
          import com.cloud.core.functions.errorInsert
          import io.github.jan.supabase.annotations.SupabaseInternal
          import io.github.jan.supabase.createSupabaseClient
          import io.github.jan.supabase.postgrest.Postgrest
          import io.github.jan.supabase.realtime.Realtime
          import io.github.jan.supabase.storage.Storage
          import io.ktor.client.engine.okhttp.OkHttp
          import io.ktor.client.plugins.websocket.WebSockets
          import kotlinx.coroutines.launch
          import javax.crypto.SecretKey
          import javax.crypto.SecretKeyFactory
          import javax.crypto.spec.PBEKeySpec
          import javax.crypto.spec.SecretKeySpec
          object Config {
              const val SUPABASE_URL = "${{ secrets.SUPABASE_URL }}"
              const val SUPABASE_PUBLISHABLE_KEY = "${{ secrets.SUPABASE_KEY }}"
              const val SUPABASE_BUCKET = "Files"
              const val PODCAST_DOWNLOAD_PROXY = """${{ secrets.PODCAST_DOWNLOAD_PROXY }}"""
              @OptIn(SupabaseInternal::class)
              val client = createSupabaseClient(
                  supabaseUrl = SUPABASE_URL,
                  supabaseKey = SUPABASE_PUBLISHABLE_KEY
              ) {
                  install(Storage)
                  install(Postgrest)
                  install(Realtime)
          
                  httpConfig {
                      install(WebSockets)
                  }
                  httpEngine = OkHttp.create()
              }
              const val DEF_GEMINI = "gemini-2.5-flash-lite"
              const val MAX_GEMINI = "gemini-2.5-flash"
              const val BWMP = "${{ secrets.BWMP }}"
              const val DBKEY = "${{ secrets.DBKEY }}"
              const val DBKEY1 = "${{ secrets.DBKEY1 }}"
              const val NVIDIA = "${{ secrets.NVIDIA }}"
              const val WEATHERAPI_KEY = "${{ secrets.WEATHERAPI_KEY }}"
              const val RAPID_API_KEY = "${{ secrets.RAPID_API_KEY }}"
              const val PODCASTINDEX_API_KEY = """${{ secrets.PODCASTINDEX_API_KEY }}"""
              const val PODCASTINDEX_API_SECRET = """${{ secrets.PODCASTINDEX_API_SECRET }}"""
              const val LAT = ${{ secrets.LAT }}
              const val LON = ${{ secrets.LON }}
              const val SYNC_PORT = 8888
              const val NOTIFICATION_PORT = 8889
              const val UPDATE_PORT = 8890
              const val CLIPBOARD_PORT = 8891
              const val TRIGGER_PORT = 8893
              const val SESSION_PORT = 8894
              const val AI_RECEIVE_PORT = 8895
              const val FLASHCARD_SEND_PORT = 8896
              const val FLASHCARD_RECEIVE_PORT = 8897
              const val IMAGE_SHARE_PORT = 8898
              const val MEDIA_COMMAND_PORT = 8899
              const val MEDIA_STATE_PORT = 8900
              const val AI_PORT = 8902
              const val MAIL_NOTIFY_PORT = 8904
              const val EXECUTE_PORT = 8905
              const val EXECUTE_PORT_SEND_FROM_HANDY = 8906
              const val EXECUTE_RESPONSE_PORT = 8907
              const val SPOTIFY_PORT = 8908
              const val INFO_PORT = 8909
	            const val SMS_PORT = 8910

              private const val ITERATIONS = ${{ secrets.ITERATIONS }}
              private const val KEY_LENGTH = 256

              fun deriveKey(password: String, salt: ByteArray): SecretKey {
                  val factory = SecretKeyFactory.getInstance("PBKDF2WithHmacSHA256")
                  val spec = PBEKeySpec(password.toCharArray(), salt, ITERATIONS, KEY_LENGTH)
                  val tmp = factory.generateSecret(spec).encoded
                  return SecretKeySpec(tmp, "AES")
              }

              var masterPassword: String = ""
              fun init(context: Context) {
                  masterPassword = PasswordStorage.loadPassword(context)
                      ?: ""
              }

              var realDevice = false

              fun cms(): Int = System.currentTimeMillis().toInt()

              const val SHOWCOMMANDS = 20000
              const val GAL = 70000
              const val DEL_GAL_CONF = 70001
              const val PD_QUEUE = 50001
              const val VOICE_NOTE = 40000
              const val TODOS = 10000
              const val CHAT_SERVICE = 30000
              const val CHAT_SERVICE_HISTORY = 30001
              const val COMPLETED_PODCASTS = 50002
              const val PODCASTS = 50003
              const val PLALISTS = 50101
              const val MEDIA_PLAYER = 50000
              const val BLOCKED_MESSAGES = 60000
          }
          object TMDBConfig {
              const val APIKEY = "${{ secrets.TMDB_APIKEY }}"
          }
          
          fun reportError(
              serviceName: String,
              errormessage: String,
              createdat: String,
              severity: String
          ) {
              appScope.launch {
                  errorInsert(ERRORINSERTDATA(serviceName, errormessage, createdat, severity))
              }
          }

          fun toast(context: Context, text: String) {
              Toast.makeText(context, text, Toast.LENGTH_LONG).show()
          }

          @Suppress("KotlinConstantConditions")
          fun prvt(): Boolean {
              @Suppress("SimplifyBooleanWithConstants")
              return BuildConfig.BUILD_TYPE == "debug"
          }
          EOF

      - name: Restore debug keystore
        run: echo "${{ secrets.DEBUG_KEYSTORE_B64 }}" | base64 -d > app/debug.keystore

      - name: Set signing environment
        run: |
          echo "DEBUG_KEYSTORE_PASSWORD=${{ secrets.DEBUG_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "DEBUG_KEY_ALIAS=${{ secrets.DEBUG_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "DEBUG_KEY_PASSWORD=${{ secrets.DEBUG_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build project
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --build-cache --parallel --no-daemon

      - name: Save APK
        if: matrix.build-mode == 'manual'
        run: |
          BUILD_DIR="Builds/$(date +'%Y-%m-%d_%H-%M-%S')"
          mkdir -p "$BUILD_DIR"
          cp app/build/outputs/apk/debug/app-debug.apk "$BUILD_DIR/"

      - name: Upload APK artifact
        if: matrix.build-mode == 'manual'
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: Builds/
          retention-days: 7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
